name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Đẩy liên tiếp lên cùng một nhánh thì huỷ lần chạy cũ cho đỡ tốn thời gian máy chạy
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Kiểm tra kiểu, lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Máy chạy CI không có .env.local. NextAuth đòi có secret lúc build, còn mọi trang
      # đều render theo yêu cầu nên không gọi API thật khi build.
      # Toàn bộ là giá trị giả — không phải bí mật thật.
      NEXTAUTH_SECRET: ci-secret-not-used-anywhere-real
      NEXTAUTH_URL: http://localhost:3001
      API_BASE_URL: http://localhost:4000

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Cài đặt phụ thuộc
        # npm ci: dừng ngay nếu package-lock.json lệch với package.json
        run: npm ci

      - name: Kiểm tra kiểu TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Build production
        run: npm run build
